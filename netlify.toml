[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback. Netlify matches real files first, so this never shadows
# /offline.html, /sw.js or anything under /assets/.
# Brakujący plik silnika OCR to 404, nie strona aplikacji — inaczej service worker zapisałby
# index.html jako .wasm/.gz pod ścieżką „immutable” i OCR byłby zepsuty do wyczyszczenia cache.
[[redirects]]
  from = "/ocr/*"
  to = "/ocr-missing"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed filenames — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Silnik OCR Analizatora planów (public/ocr/<wersja>/): ścieżka z wersją, więc niezmienny.
# .gz to dane języków — typ binarny, żeby hosting nie dokładał Content-Encoding (worker i tak sprawdza bajty gzip).
[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/ocr/*.gz"
  [headers.values]
    Content-Type = "application/octet-stream"

# The service worker must never be cached: a stale sw.js means the app can
# never ship an update to users who already installed it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

# Pulled in by sw.js via importScripts() and NOT content-hashed — same reason.
[[headers]]
  for = "/sw-notifications.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json"

# Nagłówki bezpieczeństwa (Plan-nowy 1.11: CSP egzekwowane). Źródłem jest vercel.json — `vite preview`
# czyta stamtąd te same nagłówki, więc e2e biegnie pod tą polityką, a `securityHeaders.test.ts` pilnuje,
# żeby oba pliki się zgadzały. Naruszenia trafiają do diagnostyki (`securitypolicyviolation`).
# `connect-src` zostawia wss:/https: — adresy serwerów sygnalizacyjnych ustawia użytkownik.
# Permissions-Policy (S1.3): używane funkcje (kamera, mikrofon, lokalizacja, czujniki ruchu dla poziomicy, wake lock,
# schowek, udostępnianie, passkey) tylko dla tej strony; nieużywane (USB, Bluetooth, MIDI, płatności…) wyłączone.
# COOP/CORP `same-origin`: obce strony nie trzymają uchwytu do naszego okna ani nie osadzają naszych zasobów.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-src 'self' blob:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types default dompurify"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self), screen-wake-lock=(self), clipboard-read=(self), clipboard-write=(self), web-share=(self), publickey-credentials-get=(self), publickey-credentials-create=(self), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=(), xr-spatial-tracking=(), idle-detection=(), browsing-topics=()"
