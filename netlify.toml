[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback. Netlify matches real files first, so this never shadows
# /offline.html, /sw.js or anything under /assets/.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed filenames — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached: a stale sw.js means the app can
# never ship an update to users who already installed it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

# Pulled in by sw.js via importScripts() and NOT content-hashed — same reason.
[[headers]]
  for = "/sw-notifications.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json"

# Nagłówki bezpieczeństwa. CSP idzie najpierw jako Report-Only: naruszenia trafiają do
# diagnostyki (`securitypolicyviolation`), a po tygodniu bez zgłoszeń zmień nazwę
# nagłówka na Content-Security-Policy. `connect-src` zostawia wss:/https: — adresy
# serwerów sygnalizacyjnych ustawia użytkownik. public/offline.html ma jeden
# inline-skrypt i do czasu przeniesienia go zgłosi naruszenie.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), geolocation=(), payment=()"
