    <!-- Styl i jasność przed pierwszym malowaniem (plan motywów 2026-10-30, 0.5) — bez mignięcia jasnego Zeszytu.
         Osobny plik, nie wpisany w HTML: CSP ma `script-src 'self'`. Synchroniczny, w precache. -->
    <script src="/prepaint.js"></script>
    <!-- Ekran startowy (tylko zainstalowana aplikacja albo ?splash): „notki” pisane długopisem kreska po kresce, kropka nad „i” na końcu; znika, gdy notatki są gotowe (src/lib/bootSplash.ts). -->
    <style>
      #boot-splash { display: none; }
      @media (display-mode: standalone), (display-mode: fullscreen) { #boot-splash { display: grid; } }
      html.boot-force #boot-splash { display: grid; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999; place-items: center;
        background: radial-gradient(120% 80% at 50% 42%, #2a1f15 0%, #15110e 55%, #0f0d10 100%);
        transition: opacity 0.38s ease, visibility 0.38s;
      }
      #boot-splash.boot-out { opacity: 0; visibility: hidden; pointer-events: none; }
      #boot-splash svg { width: min(62vw, 240px); height: auto; overflow: visible; filter: drop-shadow(0 0 7px rgba(255, 138, 64, 0.45)); }
      #boot-splash .s { fill: none; stroke: url(#boot-g); stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: boot-draw var(--t, 0.3s) cubic-bezier(0.5, 0, 0.25, 1) var(--d) forwards; }
      #boot-splash .u { stroke-width: 1.6; stroke-opacity: 0.7; }
      #boot-splash .dot { fill: #ffb347; transform-box: fill-box; transform-origin: center; transform: scale(0);
        animation: boot-pop 0.36s cubic-bezier(0.34, 1.8, 0.64, 1) 1.06s forwards; }
      /* Przezroczyste do startu: zaokrąglony koniec kreski o zerowej długości rysuje kropkę. */
      @keyframes boot-draw { from { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes boot-pop { to { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .s { animation: none; stroke-dashoffset: 0; opacity: 1; }
        #boot-splash .dot { animation: none; transform: none; }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <svg viewBox="0 0 82 40">
        <defs>
          <linearGradient id="boot-g" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="78" y2="0">
            <stop offset="0" stop-color="#ffc247" /><stop offset="0.55" stop-color="#ff8a40" /><stop offset="1" stop-color="#ec5562" />
          </linearGradient>
        </defs>
        <path class="s" style="--d: 0.1s; --t: 0.34s" pathLength="1" d="M6 30V20Q6 16 11.5 16Q17 16 17 21V30" />
        <path class="s" style="--d: 0.38s; --t: 0.32s" pathLength="1" d="M36 23A7 7 0 1 1 22 23A7 7 0 1 1 36 23" />
        <path class="s" style="--d: 0.62s; --t: 0.2s" pathLength="1" d="M44 8V26Q44 30 48 30H50" />
        <path class="s" style="--d: 0.74s; --t: 0.12s" pathLength="1" d="M40 16H50" />
        <path class="s" style="--d: 0.8s; --t: 0.16s" pathLength="1" d="M56 5V30" />
        <path class="s" style="--d: 0.9s; --t: 0.14s" pathLength="1" d="M67 16L57 25" />
        <path class="s" style="--d: 0.96s; --t: 0.1s" pathLength="1" d="M60.5 22.5L67.5 30" />
        <path class="s" style="--d: 1s; --t: 0.1s" pathLength="1" d="M74 16V30" />
        <circle class="dot" cx="74" cy="9.6" r="2" />
        <path class="s u" style="--d: 1.08s; --t: 0.3s" pathLength="1" d="M7 36.5Q40 33.5 75 36" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
