name: CI

# AR-3 (2026-11-23): CI na każdej gałęzi. Pełne e2e (ponad godzina) tylko przy pushu na master/main;
# gałęzie robocze i PR dostają szybkie testy @smoke — wynik w kilka minut.
on:
  push:
  pull_request:
    branches: [master, main]

# S5.3: najmniejsze uprawnienia tokenu; akcje przypięte do pełnego skrótu (komentarz = wersja, Dependabot je podbija).
# Żadne zadanie nie używa sekretów, więc PR z forka nic nie dostaje.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # WebKit potrzebny, bo projekt „iphone-14” w playwright.config.ts to WebKit (tam wykryliśmy awarię View Transitions).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E — pełne (master)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: npm run test:e2e

      - name: E2E — @smoke (gałęzie i PR)
        if: "!(github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))"
        run: npm run test:e2e:smoke

  # Serwery pomocnicze mają własne testy (bezpieczeństwo: uwierzytelnianie, SSRF, limity, odporność na złośliwe pakiety).
  servers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [push-server, relay-server]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - run: npm ci

      - name: Testy serwera
        run: npm test

      - name: Audyt zależności (tylko produkcyjne)
        run: npm audit --omit=dev --audit-level=high

  # S5.1: audyt zależności produkcyjnych aplikacji — osobne zadanie, żeby błąd audytu nie zasłaniał testów.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Audyt zależności aplikacji (tylko produkcyjne)
        run: npm audit --omit=dev --audit-level=high

  # S5.4: skan sekretów w historii gitleaks. Binarka z wydania, sprawdzana sumą SHA-256 (bez akcji z licencją).
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Pobierz gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks

      - name: Skan sekretów
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1'
