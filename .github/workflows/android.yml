name: Android APK

# Buduje APK powłoki Androida (F1, ADR-8). Uruchamiane ręcznie albo tagiem `apk-*`.
# Sekrety (Settings → Secrets → Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Bez nich powstaje APK próbny (debug) — da się go
# zainstalować, ale każdy przebieg podpisuje go innym kluczem, więc nie zaktualizuje poprzedniego.
on:
  workflow_dispatch:
  push:
    tags: ["apk-*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: npm ci --ignore-scripts

      - name: Build web + sync
        run: npm run build:android

      - name: Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/notki.jks"

      - name: APK podpisany
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          NOTKI_KEYSTORE_FILE: ${{ runner.temp }}/notki.jks
          NOTKI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOTKI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOTKI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NOTKI_VERSION_CODE: ${{ github.run_number }}
          NOTKI_VERSION_NAME: ${{ github.ref_name }}-${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: APK próbny (bez klucza)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        env:
          NOTKI_VERSION_CODE: ${{ github.run_number }}
          NOTKI_VERSION_NAME: ${{ github.ref_name }}-${{ github.run_number }}-debug
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Usuń klucz
        if: always()
        run: rm -f "$RUNNER_TEMP/notki.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notki-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
